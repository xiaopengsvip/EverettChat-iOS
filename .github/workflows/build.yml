name: iOS Build Xcode 27

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Xcode Version
        run: |
          echo "=== 系统版本 ==="
          sw_vers
          echo "=== Xcode 版本 ==="
          xcodebuild -version
          echo "=== 可用 SDK ==="
          xcodebuild -showsdks
          echo "=== 实际使用 Xcode ==="
          xcode-select -p

      - name: Install XcodeGen (project.yml 项目，需要生成 .xcodeproj)
        run: |
          brew install xcodegen || brew upgrade xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compute version (YY.MMDD.XXXX)
        run: |
          BUILD=$(git rev-list --count HEAD)
          printf 'EVO_VERSION=%.2d.%s.%04d\n' $((10#$(date +%y))) "$(date +%m%d)" $((BUILD + 1000)) >> $GITHUB_ENV
          echo "版本: $EVO_VERSION"

      - name: Build (device, no signing)
        run: |
          set -o pipefail
          xcodebuild -project EverettChat.xcodeproj \
            -scheme EverettChat \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION=$EVO_VERSION \
            CURRENT_PROJECT_VERSION=$((10#$(date +%y)) * 100000 + $(date +%m%d)) \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || true
          tail -80 build.log
          if grep -q "BUILD FAILED\|error:" build.log; then
            echo "::error::BUILD FAILED"
            exit 1
          fi

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Package IPA
        run: |
          APP_PATH=$(find build -name "EverettChat.app" -type d | head -1)
          echo "APP_PATH=$APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found in build/"
            find build -maxdepth 4 -type d | head -20
            exit 1
          fi
          cd "$(dirname "$APP_PATH")"
          mkdir -p Payload
          cp -R EverettChat.app Payload/
          zip -r EverettChat.ipa Payload
          ls -lh EverettChat.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EverettChat-device-ipa
          path: build/Build/Products/Debug-iphoneos/EverettChat.ipa
          if-no-files-found: warn
