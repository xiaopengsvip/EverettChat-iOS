name: Build iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Environment info
        run: |
          xcodebuild -version
          which xcodegen || echo "xcodegen NOT found"

      - name: Install XcodeGen (if missing)
        if: ${{ runner.os == 'macOS' }}
        run: |
          which xcodegen || brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (simulator, no signing)
        run: |
          xcodebuild -project EverettChat.xcodeproj \
            -scheme EverettChat \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tail -40

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: EverettChat-simulator
          path: build/Build/Products/Debug-iphonesimulator/EverettChat.app
          if-no-files-found: warn
