name: Build iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Environment info
        run: |
          xcodebuild -version
          which xcodegen || echo "xcodegen NOT found"

      - name: Install XcodeGen (if missing)
        if: ${{ runner.os == 'macOS' }}
        run: |
          which xcodegen || brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (device, no signing)
        run: |
          xcodebuild -project EverettChat.xcodeproj \
            -scheme EverettChat \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tail -40

      - name: Package IPA
        run: |
          APP_PATH=$(find build -name "EverettChat.app" -type d | head -1)
          echo "APP_PATH=$APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found in build/"
            find build -maxdepth 4 -type d | head -20
            exit 1
          fi
          cd "$(dirname "$APP_PATH")"
          mkdir -p Payload
          cp -R EverettChat.app Payload/
          zip -r EverettChat.ipa Payload
          ls -lh EverettChat.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EverettChat-device-ipa
          path: build/Build/Products/Debug-iphoneos/EverettChat.ipa
          if-no-files-found: warn
