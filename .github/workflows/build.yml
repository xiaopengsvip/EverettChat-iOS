name: Build iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Environment info
        run: |
          xcodebuild -version
          which xcodegen || echo "xcodegen NOT found"

      - name: Install XcodeGen (pinned 2.42.0 for Xcode 15 compat)
        run: |
          curl -L -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip
          unzip -o /tmp/xcodegen.zip -d /tmp/xcodegen
          echo "/tmp/xcodegen/xcodegen/bin" >> $GITHUB_PATH
          /tmp/xcodegen/xcodegen/bin/xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compute version (YY.MMDD.XXXX)
        run: |
          BUILD=$(git rev-list --count HEAD)
          printf 'EVO_VERSION=%.2d.%s.%04d\n' $((10#$(date +%y))) "$(date +%m%d)" $((BUILD + 1000)) >> $GITHUB_ENV
          echo "版本: $EVO_VERSION"

      - name: Build (device, no signing)
        run: |
          set -o pipefail
          xcodebuild -project EverettChat.xcodeproj \
            -scheme EverettChat \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION=$EVO_VERSION \
            CURRENT_PROJECT_VERSION=$((10#$(date +%y)) * 100000 + $(date +%m%d)) \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tail -60

      - name: Package IPA
        run: |
          APP_PATH=$(find build -name "EverettChat.app" -type d | head -1)
          echo "APP_PATH=$APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found in build/"
            find build -maxdepth 4 -type d | head -20
            exit 1
          fi
          cd "$(dirname "$APP_PATH")"
          mkdir -p Payload
          cp -R EverettChat.app Payload/
          zip -r EverettChat.ipa Payload
          ls -lh EverettChat.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EverettChat-device-ipa
          path: build/Build/Products/Debug-iphoneos/EverettChat.ipa
          if-no-files-found: warn
