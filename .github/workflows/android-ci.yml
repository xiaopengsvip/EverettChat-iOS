name: Android Build & Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 工具链版本检查（规范：最新 SDK First）
        run: |
          echo "=== Java ==="
          java -version
          echo "=== Gradle Wrapper ==="
          ./gradlew --version | head -8 || true
          echo "=== Android SDK ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME/platforms/ 2>/dev/null || true
          ls $ANDROID_HOME/build-tools/ 2>/dev/null | tail -3 || true

      - name: 检查 compileSdk/targetSdk（规范：API 36+）
        run: |
          COMPILE_SDK=$(grep -oP 'compileSdk\s*=\s*\K[0-9]+' app/build.gradle.kts)
          TARGET_SDK=$(grep -oP 'targetSdk\s*=\s*\K[0-9]+' app/build.gradle.kts)
          echo "compileSdk=$COMPILE_SDK  targetSdk=$TARGET_SDK"
          if [ "$COMPILE_SDK" -lt 36 ]; then
            echo "::error::compileSdk $COMPILE_SDK < 36，违反最新 SDK 规范"
            exit 1
          fi
          if [ "$TARGET_SDK" -lt 36 ]; then
            echo "::error::targetSdk $TARGET_SDK < 36，Google Play 要求 API 36+"
            exit 1
          fi
          echo "SDK 检查通过 ✅"

      - name: 安装最新 SDK（API 36 + Build Tools）
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;37.0.0" "platform-tools" > /dev/null 2>&1 || \
            (yes | sdkmanager --install "platforms;android-36" "build-tools;37.0.0" "platform-tools")
          sdkmanager --list_installed | grep -E "platforms|build-tools" | tail -5

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -20
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::BUILD FAILED"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: evo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  # Android 16 (API 36) 模拟器测试（规范：真实环境验证）
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build
    defaults:
      run:
        working-directory: android

    strategy:
      matrix:
        api-level: [36]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "KVM 不可用（跳过硬件加速）"

      - name: 安装 Android SDK + API ${{ matrix.api-level }} 镜像
        run: |
          sdkmanager --install "platforms;android-${{ matrix.api-level }}" "build-tools;37.0.0" "platform-tools" "emulator" > /dev/null 2>&1 || true
          sdkmanager --install "system-images;android-${{ matrix.api-level }};google_apis;x86_64" > /dev/null 2>&1 || \
            sdkmanager --install "system-images;android-${{ matrix.api-level }};default;x86_64" > /dev/null 2>&1 || true
          echo "no" | avdmanager create avd -n test -k "system-images;android-${{ matrix.api-level }};google_apis;x86_64" --force || \
            echo "no" | avdmanager create avd -n test -k "system-images;android-${{ matrix.api-level }};default;x86_64" --force

      - name: 启动模拟器
        run: |
          $ANDROID_HOME/emulator/emulator -avd test -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -accel off &
          adb wait-for-device
          for i in $(seq 1 60); do
            if adb shell getprop sys.boot_completed 2>/dev/null | grep -q 1; then
              echo "✅ 模拟器启动完成 (API ${{ matrix.api-level }})"
              break
            fi
            sleep 5
          done
          adb shell getprop ro.build.version.sdk
          adb shell getprop ro.build.version.release

      - name: 安装 APK 并启动
        run: |
          APK=$(find app/build/outputs -name "*.apk" | head -1)
          echo "APK: $APK"
          adb install -r -t "$APK"
          adb shell am start -n top.vios.chat/.MainActivity
          sleep 8
          adb shell dumpsys activity activities | grep -i "top.vios.chat" | head -3 || echo "Activity 检查"

      - name: 冒烟测试（应用存活 + 版本上报）
        run: |
          VERSION=$(adb shell dumpsys package top.vios.chat 2>/dev/null | grep versionName | head -1)
          echo "已安装版本: $VERSION"
          if echo "$VERSION" | grep -q "26\."; then
            echo "✅ 冒烟测试通过"
          else
            echo "⚠️ 版本格式检查"
          fi

      - name: Upload Logcat (always)
        if: always()
        run: |
          adb logcat -d -t 300 > logcat.txt 2>/dev/null || true
        continue-on-error: true
