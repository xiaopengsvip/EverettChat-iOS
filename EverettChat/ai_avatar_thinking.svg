<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512" viewBox="0 0 512 512"
     role="img" aria-labelledby="title desc">
  <title id="title">Evo AI Avatar Animation</title>
  <desc id="desc">Animated transparent avatar frame for Evo AI Assistant.</desc>

  <defs>
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9B7BFA" stop-opacity=".35"/>
      <stop offset="50%" stop-color="#7B5CE7" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#5B3CC7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auraGradient">
      <stop offset="0%" stop-color="#A989FF" stop-opacity=".40"/>
      <stop offset="60%" stop-color="#8A66F4" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#8A66F4" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <style>
      /* 头像外框呼吸 */
      .avatarFrame {
        animation: framePulse 2.4s ease-in-out infinite;
        transform-origin: 256px 256px;
      }

      /* 外圈光晕 */
      .aura {
        animation: auraPulse 2.4s ease-in-out infinite;
        transform-origin: 256px 256px;
      }

      .aura2 {
        animation: auraPulse 2.4s ease-in-out infinite;
        transform-origin: 256px 256px;
        animation-delay: .8s;
      }

      .aura3 {
        animation: auraPulse 2.4s ease-in-out infinite;
        transform-origin: 256px 256px;
        animation-delay: 1.6s;
      }

      /* 声波扩散环（待机时柔和） */
      .soundRing {
        animation: soundWave 2.8s ease-out infinite;
        transform-origin: 256px 256px;
      }
      .soundRing2 { animation-delay: .9s; }
      .soundRing3 { animation-delay: 1.8s; }

      /* 中心呼吸点 */
      .centerDot {
        animation: dotPulse 1.8s ease-in-out infinite;
        transform-origin: 256px 256px;
      }

      @keyframes framePulse {
        0%, 100% { opacity: .85; transform: scale(.98); }
        50% { opacity: 1; transform: scale(1.02); }
      }

      @keyframes auraPulse {
        0%, 100% { opacity: .35; transform: scale(.92); }
        50% { opacity: .65; transform: scale(1.06); }
      }

      @keyframes soundWave {
        0% { opacity: .35; transform: scale(.75); }
        100% { opacity: 0; transform: scale(1.2); }
      }

      @keyframes dotPulse {
        0%, 100% { opacity: .4; transform: scale(.7); }
        50% { opacity: .9; transform: scale(1.1); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; }
      }
    </style>
  </defs>

  <!-- 背景光晕 -->
  <circle class="aura" cx="256" cy="256" r="180" fill="url(#auraGradient)" filter="url(#glow)"/>
  <circle class="aura2" cx="256" cy="256" r="180" fill="url(#auraGradient)" filter="url(#glow)"/>
  <circle class="aura3" cx="256" cy="256" r="180" fill="url(#auraGradient)" filter="url(#glow)"/>

  <!-- 声波扩散环（待机柔和） -->
  <circle class="soundRing" cx="256" cy="256" r="180"
          fill="none" stroke="#A989FF" stroke-width="2.5" stroke-opacity=".35"/>
  <circle class="soundRing soundRing2" cx="256" cy="256" r="180"
          fill="none" stroke="#BBA9FF" stroke-width="2" stroke-opacity=".25"/>
  <circle class="soundRing soundRing3" cx="256" cy="256" r="180"
          fill="none" stroke="#9B7BFA" stroke-width="1.5" stroke-opacity=".20"/>

  <!-- 默认头像背景（紫色渐变圆） -->
  <circle cx="256" cy="256" r="140" fill="url(#bgGradient)"/>

  <!-- 圆形白色外框（玻璃质感） -->
  <circle class="avatarFrame" cx="256" cy="256" r="145"
          fill="#FFFFFF" fill-opacity=".08"
          stroke="#FFFFFF" stroke-opacity=".65" stroke-width="4"/>
  <circle cx="256" cy="256" r="142"
          fill="none"
          stroke="#FFFFFF" stroke-opacity=".15" stroke-width="1.5"/>

  <!-- 头像中央区域（留位放角色图，用抽象几何体简化） -->
  <!-- 肩膀/身体轮廓（白衬衫简化） -->
  <path d="M200 340 Q210 280 220 260 L292 260 Q302 280 312 340 Z"
        fill="#FFFFFF" fill-opacity=".15"/>

  <!-- 头部轮廓（圆形，代表角色头部） -->
  <circle cx="256" cy="230" r="52" fill="#FFFFFF" fill-opacity=".12"/>

  <!-- 眼镜（简约两个方框） -->
  <rect x="225" y="215" width="24" height="16" rx="4"
        fill="none" stroke="#FFFFFF" stroke-opacity=".50" stroke-width="2"/>
  <rect x="263" y="215" width="24" height="16" rx="4"
        fill="none" stroke="#FFFFFF" stroke-opacity=".50" stroke-width="2"/>
  <line x1="249" y1="223" x2="263" y2="223"
        stroke="#FFFFFF" stroke-opacity=".40" stroke-width="1.5"/>

  <!-- 白衬衫衣领 -->
  <path d="M240 290 L256 275 L272 290"
        fill="none" stroke="#FFFFFF" stroke-opacity=".30" stroke-width="2"/>

  <!-- 中心呼吸点 -->
  <circle class="centerDot" cx="256" cy="256" r="4" fill="#FFFFFF" opacity=".6"/>

  <!-- 标签 -->
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
     text-anchor="middle">
    <text x="256" y="420" font-size="18" font-weight="800"
          letter-spacing="3" fill="#7B5CE7">EVO AI</text>
    <text x="256" y="442" font-size="12"
          letter-spacing="2" fill="#8B7AAE">ASSISTANT</text>
  </g>
</svg>