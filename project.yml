name: EverettChat
options:
  bundleIdPrefix: top.vios
  deploymentTarget:
    iOS: "16.2"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    from: "125.0.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.2"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  EverettChat:
    type: application
    platform: iOS
    sources:
      - EverettChat
      - EvoWidget/EvoActivityAttributes.swift
    dependencies:
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.vios.chat
        INFOPLIST_KEY_CFBundleDisplayName: EVO
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
        UILaunchStoryboardName: LaunchScreen
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_NSAppTransportSecurity: NSAllowsArbitraryLoads
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_KEY_NSCameraUsageDescription: "用于视频通话与扫码添加好友"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "用于语音消息与语音通话"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "用于发送图片与保存二维码"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "用于天气与定位服务"
        INFOPLIST_KEY_NFCReaderUsageDescription: "用于 NFC 碰一碰文件互传"
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "用于蓝牙直连"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "用于局域网直连设备发现"
        INFOPLIST_KEY_NSBonjourServices: "_everett._tcp"
        INFOPLIST_KEY_UIBackgroundModes: "voip,audio"
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSSupportsLiveActivitiesFrequentUpdates: YES

  EvoWidget:
    type: app-extension
    platform: iOS
    sources:
      - EvoWidget
    dependencies:
      - target: EverettChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.vios.chat.EvoWidget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        INFOPLIST_KEY_CFBundleDisplayName: EVO
        INFOPLIST_KEY_NSAppTransportSecurity: NSAllowsArbitraryLoads
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "16.2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
