name: EverettChat
options:
  bundleIdPrefix: top.vios
  deploymentTarget:
    iOS: "16.2"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    from: "125.0.0"
  SwiftKyber:
    url: https://github.com/leif-ibsen/SwiftKyber
    from: "3.1.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.2"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)"
targets:
  EverettChat:
    type: application
    platform: iOS
    sources:
      - EverettChat
      - EvoWidget/EvoActivityAttributes.swift
    resources:
      - path: EverettChat/LottieAnimations
        buildPhase: resources
    dependencies:
      - package: WebRTC
      - package: SwiftKyber
      - framework: Lottie.framework
        embed: true
    info:
      path: EverettChat/Info.plist
      properties:
        CFBundleDisplayName: EVO
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        CFBundleURLTypes:
          - CFBundleURLName: top.vios.chat
            CFBundleURLSchemes: [evo]
        NSCameraUsageDescription: "用于视频通话与扫码添加好友"
        NSMicrophoneUsageDescription: "用于语音消息与语音通话"
        NSPhotoLibraryUsageDescription: "用于发送图片与保存二维码"
        NSLocationWhenInUseUsageDescription: "用于天气与定位服务"
        NFCReaderUsageDescription: "用于 NFC 碰一碰文件互传"
        NSBluetoothAlwaysUsageDescription: "用于蓝牙直连"
        NSLocalNetworkUsageDescription: "用于局域网直连设备发现"
        NSBonjourServices: ["_everett._tcp"]
        # 后台模式：audio 用于后台语音通话；voip/remote-notification 需要付费证书
        # 免费 Apple ID 签名（爱思）会因 voip 模式拒绝安装，故去掉
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        # ATS：允许局域网 HTTP 明文（设备互联连本机 Hermes）
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.vios.chat
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  EvoWidget:
    type: app-extension
    platform: iOS
    sources:
      - EvoWidget
    dependencies:
      - target: EverettChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.vios.chat.EvoWidget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        INFOPLIST_KEY_CFBundleDisplayName: EVO
        INFOPLIST_KEY_NSAppTransportSecurity: NSAllowsArbitraryLoads
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "16.2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
